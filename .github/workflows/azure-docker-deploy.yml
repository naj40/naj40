name: Deploy Docker container to Azure

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to Azure Container Registry
      uses: azure/docker-login@v1
      with:
        login-server: <your_acr_name>.azurecr.io
        username: ${{ secrets.AZURE_USERNAME }}
        password: ${{ secrets.AZURE_PASSWORD }}

    - name: Build and Push Docker image
      run: |
        docker build -t <your_acr_name>.azurecr.io/myapp:${{ github.sha }} .
        docker push <your_acr_name>.azurecr.io/myapp:${{ github.sha }}

    - name: Deploy to Azure App Service (or AKS)
      uses: azure/webapps-deploy@v2
      with:
        app-name: <your-app-name>
        images: <your_acr_name>.azurecr.io/myapp:${{ github.sha }}
        publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
